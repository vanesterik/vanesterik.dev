<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="632" height="306">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
    </marker>
  </defs>
  <rect x="0" y="28" width="76" height="44" rx="6" class="tag" />
  <text x="38" y="47" text-anchor="middle">designs</text>
  <text x="38" y="62" text-anchor="middle" class="small">criteria</text>
  <line x1="76" y1="50" x2="108" y2="50" class="line" marker-end="url(#arrow)" />
  <rect x="110.0" y="28" width="120" height="44" rx="6" class="box claude" />
  <text x="170" y="47.0" text-anchor="middle">explore by hand</text>
  <text x="170" y="62.0" text-anchor="middle" class="small">test-user-story</text>
  <line x1="230" y1="50" x2="298" y2="50" class="line" marker-end="url(#arrow)" />
  <text x="264" y="42" text-anchor="middle" class="small">findings</text>
  <rect x="300.0" y="28" width="120" height="44" rx="6" class="box claude" />
  <text x="360" y="47.0" text-anchor="middle">write the tests</text>
  <text x="360" y="62.0" text-anchor="middle" class="small">write-system-test</text>
  <line x1="420" y1="50" x2="468" y2="50" class="line" marker-end="url(#arrow)" />
  <text x="444" y="42" text-anchor="middle" class="small">tests</text>
  <rect x="470.0" y="28" width="120" height="44" rx="6" class="box claude" />
  <text x="530" y="47.0" text-anchor="middle">run each 5×</text>
  <text x="530" y="62.0" text-anchor="middle" class="small">in isolation</text>
  <line x1="530" y1="72" x2="530" y2="128" class="line" marker-end="url(#arrow)" />
  <rect x="470.0" y="130" width="120" height="40" rx="6" class="box " />
  <text x="530" y="154.5" text-anchor="middle">does it fail?</text>
  <line x1="470" y1="150" x2="422" y2="150" class="line" marker-end="url(#arrow)" />
  <text x="446" y="143" text-anchor="middle" class="small">yes</text>
  <rect x="300.0" y="130" width="120" height="40" rx="6" class="box " />
  <text x="360" y="154.5" text-anchor="middle">whose fault?</text>
  <line x1="360" y1="130" x2="360" y2="74" class="line" marker-end="url(#arrow)" />
  <text x="368" y="105" class="small">the test: ↻ fix it</text>
  <line x1="360" y1="170" x2="360" y2="224" class="line" marker-end="url(#arrow)" />
  <text x="368" y="201" class="small">the app</text>
  <line x1="530" y1="170" x2="530" y2="224" class="line" marker-end="url(#arrow)" />
  <text x="538" y="201" class="small">no</text>
  <rect x="300.0" y="226" width="120" height="44" rx="6" class="box me" />
  <text x="360" y="245.0" text-anchor="middle">story in Backlog</text>
  <text x="360" y="260.0" text-anchor="middle" class="small">failing test stays</text>
  <rect x="470.0" y="226" width="120" height="44" rx="6" class="box me" />
  <text x="530" y="245.0" text-anchor="middle">pull request</text>
  <text x="530" y="260.0" text-anchor="middle" class="small">for me to review</text>
  <rect x="0" y="226" width="230" height="44" rx="6" class="tag dashed" />
  <text x="115" y="252" text-anchor="middle" class="small">never touches application code</text>
  <text x="0" y="302" class="small"><tspan class="claude">■</tspan> the tester’s steps<tspan dx="14" class="me">■</tspan> what comes back to me</text>
</svg>
