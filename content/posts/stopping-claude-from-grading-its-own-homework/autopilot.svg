  <line x1="100" y1="55" x2="148" y2="55" class="line" marker-end="url(#arrow)" />
  <rect x="148.0" y="34" width="100" height="44" rx="6" class="box claude" />
  <text x="198" y="53.0" text-anchor="middle">build</text>
