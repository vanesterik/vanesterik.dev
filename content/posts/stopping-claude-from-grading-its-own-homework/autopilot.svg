  <line x1="248" y1="56" x2="288" y2="56" class="line" marker-end="url(#arrow)" />
  <rect x="288.0" y="34" width="100" height="44" rx="6" class="box claude" />
  <text x="338" y="53.0" text-anchor="middle">review</text>
