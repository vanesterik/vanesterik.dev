  <rect x="428.0" y="34" width="112" height="44" rx="6" class="box gate" />
  <text x="484" y="53.0" text-anchor="middle">merge</text>
  <text x="484" y="68.0" text-anchor="middle" class="small">approved + green CI</text>
  <line x1="540" y1="56" x2="572" y2="56" class="line" marker-end="url(#arrow)" />
  <rect x="572.0" y="38" width="60" height="36" rx="6" class="box " />
