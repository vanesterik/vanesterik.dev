  <rect x="243.0" y="238" width="190" height="44" rx="6" class="box me" />
  <text x="338" y="257.0" text-anchor="middle">stop the run</text>
  <text x="338" y="272.0" text-anchor="middle" class="small">story labeled, back to Design</text>
  <line x1="25" y1="152" x2="25" y2="236" class="line dashed" marker-end="url(#arrow)" />
